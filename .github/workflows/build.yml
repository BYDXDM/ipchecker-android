name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 签名固定为仓库内 keystore/ipdetector.keystore，保证各版本可覆盖安装。
      # 个人工具，keystore 与密码随仓库公开。
      - name: Write keystore.properties
        run: |
          echo "storeFile=${{ github.workspace }}/keystore/ipdetector.keystore" > keystore.properties
          echo "storePassword=ip123detector" >> keystore.properties
          echo "keyAlias=ipdetector" >> keystore.properties
          echo "keyPassword=ip123detector" >> keystore.properties

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Read version for release title
        if: startsWith(github.ref, 'refs/tags/v')
        id: ver
        run: |
          VNAME=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          VCODE=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle)
          echo "name=v$VNAME (versionCode $VCODE)" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ip-detector-apk
          path: |
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2（pin 到 commit，防 tag 劫持发版权）
        with:
          name: ${{ steps.ver.outputs.name }}
          body: |
            自动构建的 Release 签名 APK，可直接下载安装。
            签名固定，可覆盖安装旧版本。
          files: |
            app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
