name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore ${{ runner.temp }}/ipdetector.keystore \
            -alias ipdetector \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ip123detector \
            -keypass ip123detector \
            -dname "CN=IPDetector, OU=Dev, O=IPDetector, L=City, S=State, C=TW"

      - name: Build Release APK
        run: |
          echo "storeFile=$( echo '${{ runner.temp }}/ipdetector.keystore' )" > keystore.properties
          echo "storePassword=ip123detector" >> keystore.properties
          echo "keyAlias=ipdetector" >> keystore.properties
          echo "keyPassword=ip123detector" >> keystore.properties
          gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ip-detector-apk
          path: |
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
